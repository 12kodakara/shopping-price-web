# ============================================================
# 買い物価格比較 Web版を GitHub Pages へ公開する
#
# main へ push するたびに、次を自動で行います。
#   テスト（単体）・ビルド ┐
#   画面テスト（Playwright）┘ → 両方通れば公開 → 公開URLの確認
# 手動でも実行できます（Actions タブ → この workflow → Run workflow）。
#
# ★会社PCなど Node.js を入れられない環境からでも、push すればここで全部検証されます。★
#
# ★データは利用者の端末（ブラウザの localStorage）に保存されます。★
#   この workflow が扱うのはアプリの画面（HTML・JS・CSS・アイコン）と、
#   クラウドのログインに使う「公開前提の2つの値」だけです。
#   秘密情報（service_role キー・Secret key・データベースのパスワード）は一切受け取りません。
#
# ★最初の一度だけ、GitHub の画面で Pages を有効にする必要があります。★
#   Settings → Pages → Build and deployment → Source → 「GitHub Actions」
#   （Actions の権限では Pages の有効化はできないため）
# ============================================================

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 必要最小限の権限だけ。contents は読み取りのみで、リポジトリへ書き戻しません。
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1本ずつ。進行中のものは中断しない（中途半端な公開状態を作らないため）。
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: テストとビルド
    runs-on: ubuntu-latest

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        # package-lock.json のとおりに入れる（ci は lock を書き換えない）
        run: npm ci

      # ★壊れたものを公開しないための関門。どれか1つでも落ちれば公開しません。★
      #   画面テスト（Playwright）は別のジョブ（e2e）で並行して実行します。
      - name: 単体テスト
        run: npm test

      - name: 型チェックとビルド
        # project site なので https://<ユーザー名>.github.io/<リポジトリ名>/ の下に置きます。
        # リポジトリ名から組み立てるので、リポジトリを改名しても直す必要はありません。
        #
        # クラウド同期（Supabase）の接続設定は、リポジトリの Variables から渡します。
        #   Settings → Secrets and variables → Actions → Variables
        #     VITE_SUPABASE_URL       … Project URL
        #     VITE_SUPABASE_ANON_KEY  … 公開用キー（publishable / anon）
        # どちらも「ブラウザに配る公開前提の値」なので Variables で扱います。
        # 未設定でもビルドは成功し、その場合クラウド機能は無効（従来どおり localStorage のみ）になります。
        # ★ service_role キー・Secret key・データベースのパスワードは絶対に設定しないでください。
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # 値そのものは出力せず、「クラウド設定が入ったかどうか」だけを表示します。
      - name: クラウド設定の反映を確認
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -n "$VITE_SUPABASE_URL" ] && [ -n "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "クラウド設定: あり（ログイン機能が有効なビルド）"
            grep -rq "supabase" dist/assets || { echo "::error::設定があるのに成果物へ反映されていません"; exit 1; }
          elif [ -z "$VITE_SUPABASE_URL" ] && [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "クラウド設定: なし（従来どおり localStorage のみで動作するビルド）"
          else
            echo "::error::VITE_SUPABASE_URL と VITE_SUPABASE_ANON_KEY は両方設定してください（片方だけは不可）"
            exit 1
          fi

      - name: PWA の成果物を確認
        run: |
          set -e
          BASE="/${{ github.event.repository.name }}/"
          for f in index.html 404.html sw.js manifest.webmanifest icons/icon-192.png icons/icon-512.png; do
            test -f "dist/$f" || { echo "::error::dist/$f がありません"; exit 1; }
          done
          grep -q "const BASE = \"$BASE\";" dist/sw.js || { echo "::error::sw.js の公開先パスが $BASE になっていません"; exit 1; }
          grep -qE "const VERSION = '[0-9a-f]{12}';" dist/sw.js || { echo "::error::sw.js の版番号が埋め込まれていません"; exit 1; }
          grep -q "\"start_url\": \"$BASE\"" dist/manifest.webmanifest || { echo "::error::manifest の start_url が $BASE になっていません"; exit 1; }
          cmp -s dist/index.html dist/404.html || { echo "::error::404.html が index.html と一致しません"; exit 1; }
          echo "OK: PWA の成果物（公開先 $BASE）"

      # 公開する直前に、成果物へ秘密情報・個人データが混ざっていないか調べる。
      # 見つかった値そのものは表示しない（ファイル名と種類だけ）。
      - name: 成果物に秘密情報が無いか確認
        run: node scripts/scan-build.mjs dist

      - name: Pages の設定を読み込む
        # リポジトリの Pages が有効（Source: GitHub Actions）になっていないと、ここで失敗します。
        uses: actions/configure-pages@v5

      - name: 公開成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  e2e:
    name: 画面テスト
    runs-on: ubuntu-latest

    # 会社PC（Node.js を入れられない）では実行できない画面テストを、ここで肩代わりする。
    # 外部サービスへは接続しない：Supabase の通信はテスト内でダミー応答に差し替えている。
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: ブラウザを用意
        # 手元のPCは Microsoft Edge を使うが、ここには無いので Playwright 同梱の Chromium を入れる
        run: npx playwright install --with-deps chromium

      - name: 画面テスト（PC・スマホ・PWA・公開先パス・ログイン画面）
        run: npm run test:e2e

      - name: 失敗したときの記録を保存
        # 落ちたテストの操作記録・スクリーンショット。Actions の画面からダウンロードして原因を確認できる。
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 画面テストの記録
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    name: 公開
    # ビルドと画面テストの両方が通ったときだけ公開する
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages へ公開
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    name: 公開後の確認
    needs: deploy
    runs-on: ubuntu-latest

    # 公開されたURLに対して、実際に画面が出るか・PWA が動くかを確認する。
    # 読み取りだけで、利用者のデータにも Supabase にも触れない。
    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: Node.js を用意
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: ブラウザを用意
        run: npx playwright install --with-deps chromium

      - name: 公開URLの確認
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run verify:deploy
