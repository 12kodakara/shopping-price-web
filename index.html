<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />

    <!-- %BASE_URL% はビルド時に公開先のパス（通常は /、GitHub Pages では /<リポジトリ名>/）に置き換わる -->

    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <!-- iPhone: Safari の共有メニュー「ホーム画面に追加」で使うアイコン・名前・表示方法 -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="買い物価格比較" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
